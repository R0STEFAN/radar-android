name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.0
          name: Fluger Radar Android v1.4.0
          body: |
            ### 📡 Fluger Radar Android APK v1.4.0

            #### 🎯 Головні оновлення:
            - **🛡️ Адаптивна архітектура 45 км (Тактичний щит міста):** 1 Центр (0 км) + 6 точок на 27 км. При чистому небі опитується лише Центр (економія трафіку та ресурсів до 85%). При виявленні променя азимута автоматично будяться 2 суміжні секторні точки для формування золотого рівностороннього трикутника тріангуляції.
            - **🛰️ Двоконтурний шаховий меш 80 км (Ешелоноване ППО):** 13-вузлова мережа (Центр + 6 внутрішніх дозорних на 38 км + 6 зовнішніх точок на 72 км зі зсувом 30°). Дозорний контур моніторить простір і динамічно пробуджує зовнішній фланг при появі цілей.
            - **🎛️ Оновлений інтерфейс вибору режиму моніторингу:** Замість повзунка встановлено вибір між 2 режимами («45 км: Місто / Тактичний щит» та «80 км: Район / Ешелоноване ППО») з автоматичним масштабуванням карти під вибрану зону.
            - **📐 Тріангуляція з контролем кутової стабільності:** Діапазон кутів перетину 12°–168° та просторова кластеризація зважених центроїдів.
            - **❓ Стаціонарні цілі без руху:** Збережено надійну індикацію нерухомих сигналів і завад знаком «?».
            - **🔑 Постійний єдиний підпис:** Оновлюється автоматично поверх попередніх версій без видалення!

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть поверх поточної версії.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
