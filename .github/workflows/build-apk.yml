name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.7
          name: Fluger Radar Android v1.4.7
          body: |
            ### 📡 Fluger Radar Android APK v1.4.7

            #### 🎯 Головні оновлення:
            - **🛠️ Виправлено падіння під час оновлення/запуску на Android 12–14 (`MY_PACKAGE_REPLACED` / `ForegroundService`):**
              - Усунено системний збій `ForegroundServiceStartNotAllowedException` у `BootReceiver.kt`, який виникав на Android 12–14 одразу після встановлення оновлення поверх попередньої версії (коли Android надсилав фонову подію `MY_PACKAGE_REPLACED` до відкриття вікна програми).
              - Додано явну передачу типу служби `ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC` у `startForeground(...)` для повної сумісності з вимогами Android 14 (SDK 34).
            - **🔄 Динамічний пул та автоматична ротація `fcmToken` для «Флюгер» (`radar.quick.ua`):**
              - Вирішено проблему блокування `HTTP 403 Forbidden` анти-бот системою `radar.quick.ua` під час багатоточкової тріангуляції (7–13 вузлів сітки).
              - Кожен вузол сітки отримує власний унікальний `fcmToken` із плановою ротацією кожні 20 хвилин та миттєвим самовідновленням при `HTTP 403`.
            - **📲 Вбудоване оновлення прямо з застосунку (GitHub Auto-Updater):**
              - У вкладці «Налаштування» додано картку **«Версія та оновлення»** з перевіркою релізів GitHub, індикатором завантаження APK та миттєвим встановленням поверх поточної версії.
            - **🛡️ Протокол Мінцифри (`~5:` ChaCha20 + JSON-конверт) та 4 рівні небезпеки у верхньому HUD-банері (🟢 / 🟡 / 🔴 / 🚨).**
            - **🔑 Постійний єдиний підпис:** Оновлюється автоматично поверх попередніх версій без видалення!

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче або натисніть **«Перевірити оновлення» -> «Оновити зараз»** прямо в налаштуваннях застосунку.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
