name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.2
          name: Fluger Radar Android v1.2.2
          body: |
            ### 📡 Fluger Radar Android APK v1.2.2

            #### 🚀 Нові можливості та ключові виправлення:
            - **🎯 Локалізація цілей Мінцифри за сектором спостереження:** Цілі «Повітряна тривога» тепер строго обмежені радіусом вашого сектора спостереження. Додано перемикач «🇺🇦 Мінцифра: вся Україна (вимк: тільки сектор)», якщо потрібен загальнодержавний огляд.
            - **⏱️ Синхронізація таймера та прогрес-бару оновлення:** Таймер зворотного відліку тепер безпосередньо прив'язаний до живого циклу опитування сенсорів. Щойно надходять свіжі дані або завершується відлік, таймер і смужка прогресу скидаються на 20 с.
            - **⚡ Миттєве ручне оновлення («🔄 Зараз»):** Натискання кнопки негайно будить фонову службу та виконує прямий радіолокаційний запит без очікування завершення попереднього інтервалу.
            - **🛡️ Повне придушення нерухомих фантомних точок (Stationary Clutter):** Цілі без фізичного зміщення (антенні відбиття, РЕБ-завади, статичний шум) більше не застрягають на карті. Відображаються виключно підтверджені рухомі повітряні загрози зі швидкістю від 45 км/год.
            - **🗑️ Кнопка «Очистити історію треків»:** Додано швидке скидання всіх активних треків та шарів карти в один клік у меню налаштувань.
            - **🧭 Виправлено стрілку курсу та вектор напрямку:** Стрілка точно збігається з фізичною траєкторією польоту на карті.
            - **💣 Повне відстеження та розпізнавання КАБ (УМПК):** Точна аеродинаміка з пітон-сервера.
            - **🎯 Кластеризація залпів [Група X/Y]:** Автоматичне групування цілей у коридорі польоту.
            - **🔗 Крос-сенсорне злиття цілей (Fusion):** Злиття Флюгер + Мінцифра за курсом і відстанню.
            - **🛩️ Векторні іконки цілей (Base64):** Усі офіційні іконки вбудовані безпосередньо в код.
            - **📱 Можливість встановлення поряд з офіційним Флюгером:** Ідентифікатор `ua.rost.radar`.
            - **🗺️ Автономна темна карта без API key:** Тайловий сервіс ArcGIS Dark Gray Canvas + OSM + Satellite.

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть на смартфон.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
