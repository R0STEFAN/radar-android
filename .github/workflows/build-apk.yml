name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.6
          name: Fluger Radar Android v1.4.6
          body: |
            ### 📡 Fluger Radar Android APK v1.4.6

            #### 🎯 Головні оновлення:
            - **🔄 Динамічний пул та автоматична ротація `fcmToken` для «Флюгер» (`radar.quick.ua`):**
              - Вирішено проблему блокування `HTTP 403 Forbidden` анти-бот системою `radar.quick.ua` під час багатоточкової тріангуляції (7–13 вузлів сітки).
              - **Ізоляція за географічними вузлами (`per-node identity`):** кожна точка гексагональної сітки (`round(lat, 3), round(lng, 3)`) отримує власний унікальний криптографічно стійкий `fcmToken` (`<22 символи>:APA91b<114 символів>`), щоб один токен не «стрибав» між координатами на 38–72 км.
              - **Планова ротація кожні 20 хвилин (`FLUGER_TOKEN_TTL_SEC = 1200`)** для запобігання перевищенню годинних/добових лімітів запитів.
              - **Миттєве самовідновлення при `HTTP 403` або порожній відповіді:** автоматична зміна солі вузла, генерація свіжого `fcmToken` і прозорий повторний запит без втрати даних.
            - **📲 Вбудоване оновлення прямо з застосунку (GitHub Auto-Updater):**
              - У вкладці «Налаштування» додано картку **«Версія та оновлення»** з перевіркою релізів GitHub, індикатором завантаження APK та миттєвим встановленням поверх поточної версії.
            - **🛡️ Протокол Мінцифри (`~5:` ChaCha20 + JSON-конверт) та 4 рівні небезпеки у верхньому HUD-банері (🟢 / 🟡 / 🔴 / 🚨).**
            - **🔑 Постійний єдиний підпис:** Оновлюється автоматично поверх попередніх версій без видалення!

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче або натисніть **«Перевірити оновлення» -> «Оновити зараз»** прямо в налаштуваннях застосунку (починаючи з v1.4.5+).
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
