name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.9
          name: Fluger Radar Android v1.2.9
          body: |
            ### 📡 Fluger Radar Android APK v1.2.9

            #### 🚀 Розумне сповіщення сектору (без спаму для існуючих цілей):
            - **🟡 Одноразове сповіщення для звичайного рівня:** Звичайні (жовті) сповіщення та звуковий сигнал сектору тепер надсилаються **виключно при появі нової цілі** в секторі! Якщо ціль уже зафіксована і продовжує політ, повторні сповіщення та звуки не генеруються кожні 60 секунд.
            - **🚨 Збереження періодичних нагадувань для критичного рівня:** Якщо ціль знаходиться в критичній зоні та прямує безпосередньо на вас, тривога триває кожні 30 секунд для гарантування безпеки життя.
            - **🌐 Багатовузлове сканування сіткою (> 48 км):** Повний огляд на 90, 100, 140, 200 км через 7–13 паралельних вузлів Флюгера.
            - **🛡️ Інтелектуальна кластеризація та усунення дублікатів:** Чиста тактична картина без фантомних клонів.
            - **🔑 Постійний єдиний підпис:** Оновлюється автоматично поверх версій v1.2.6/v1.2.7/v1.2.8 без видалення!

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть поверх встановленої версії!
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
