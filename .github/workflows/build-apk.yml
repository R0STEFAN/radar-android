name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Run Unit & Live Engine Tests
        run: ./gradlew testReleaseUnitTest --info --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.8
          name: Fluger Radar Android v1.4.8
          body: |
            ### 📡 Fluger Radar Android APK v1.4.8

            #### 🎯 Головні оновлення:
            - **🛡️ Виправлено краш застосунку на старті (`v1.4.8`):**
              - **Виправлено `SupervisorJob` / `supervisorScope` у `RadarForegroundService` та `RadarApiClient`:** усунено фатальну помилку Kotlin Coroutines, через яку будь-який збій мережі у дочірньому блоці `async { ... }` передавався напряму в `UncaughtExceptionHandler` і миттєво закривав процес Android на першій секунді запуску.
              - **Захист `CopyOnWriteArrayList` для пулів сповіщень:** усунено `ConcurrentModificationException` під час одночасного сканування та скидання треків.
              - **Автономний RFC 4648 Base64 кодек:** замінено `java.util.Base64` / `android.util.Base64` на власну швидку реалізацію без залежності від версії Android SDK.
              - **Безпечний запуск `ForegroundService` та читання `SharedPreferences`:** додано захист від `ClassCastException`, `SecurityException` та подвійного старту під час запиту дозволів при першому відкритті.
              - **Автоматичні JUnit-тести (`RadarEngineTest`):** додано набір автоматичних тестів декодера `~5:` ChaCha20, ротації `fcmToken`, живих запитів до `radar.quick.ua` / `map.ukrainealarm.com` та 4 рівнів загрози перед збіркою кожного APK.
            - **🔄 Динамічний пул та автоматична ротація `fcmToken` для «Флюгер» (`radar.quick.ua`):**
              - Кожен вузол сітки отримує власний унікальний `fcmToken` із плановою ротацією кожні 20 хвилин та миттєвим самовідновленням при `HTTP 403`.
            - **📲 Вбудоване оновлення прямо з застосунку (GitHub Auto-Updater):**
              - У вкладці «Налаштування» додано картку **«Версія та оновлення»** з перевіркою релізів GitHub, індикатором завантаження APK та миттєвим встановленням поверх поточної версії.
            - **🛡️ Протокол Мінцифри (`~5:` ChaCha20 + JSON-конверт) та 4 рівні небезпеки у верхньому HUD-банері (🟢 / 🟡 / 🔴 / 🚨).**
            - **🔑 Постійний єдиний підпис:** Оновлюється автоматично поверх попередніх версій без видалення!

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче або натисніть **«Перевірити оновлення» -> «Оновити зараз»** прямо в налаштуваннях застосунку.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
