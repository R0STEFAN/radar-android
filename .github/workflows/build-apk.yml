name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.1
          name: Fluger Radar Android v1.3.1
          body: |
            ### 📡 Fluger Radar Android APK v1.3.1

            #### 🎯 Головні оновлення та виправлення:
            - **🟡 Повне усунення спаму сповіщень у секторі (Просторове та часове відстеження):** Виправлено проблему, через яку звичайне (жовте) сповіщення та звуковий сигнал повторювалися при кожному 20-секундному оновленні даних, навіть коли ціль залишалась тією ж і летіла за своєю траєкторією.
              - Впроваджено інтелектуальну просторово-часову неперервність цілей: якщо ціль переміщується коридором польоту або навіть змінює внутрішній ідентифікатор треку через коливання тріангуляції чи злиття сенсорів, система надійно розпізнає її як **ту саму фізичну загрозу**!
              - Звуковий сигнал і вібрація сектора спрацьовують **строго один раз** при виявленні нової цілі.
              - При подальшому русі існуючих цілей інформація в рядку стану оновлюється беззвучно, без повторних сигналів.
            - **🧭 Стійкість асоціації треків до маневрів та похибок тріангуляції:** Збільшено стійкість алгоритму супроводу цілей до бічних коливань і розворотів БПЛА/ракет, запобігаючи скиданню треку на новий ID.
            - **🔄 Захист від паралельних циклів моніторингу:** Гарантовано роботу єдиного фонового процесу оновлення даних.
            - **❓ Знак питання для невідомого стану:** Збережено відображення знака питання (`?`) для стаціонарних цілей Флюгера.
            - **🚨 Строгий кут курсу на вас ($\le 20^\circ$):** Критична сирена активується строго при прямому курсі на користувача.
            - **🔑 Постійний єдиний підпис:** Оновлюється автоматично поверх версій v1.2.6+ без видалення!

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть поверх поточної версії.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
