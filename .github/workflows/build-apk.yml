name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0
          name: Fluger Radar Android v1.2.0
          body: |
            ### 📡 Fluger Radar Android APK v1.2.0

            #### 🚀 Нові можливості та ключові виправлення:
            - **⏱️ Частота оновлення 20 секунд:** Інтервал опитування та таймер синхронізовано з офіційним сервером Флюгер (20 сек).
            - **💣 Повне відстеження та розпізнавання КАБ (УМПК):** Точна аеродинаміка з пітон-сервера (швидкість звалювання, ліміт планування 60–140 сек, пікова швидкість скидання >= 580 км/год, класифікація сходження та пікірування).
            - **🎯 Кластеризація залпів [Група X/Y]:** Автоматичне групування парних та групових цілей у єдиному коридорі польоту.
            - **🔗 Крос-сенсорне злиття цілей (Fusion):** Розрахунок спорідненості цілей Флюгер + Мінцифра за курсом і відстанню, центроїдна середня точка та об'єднаний тактичний слід.
            - **🇺🇦 Точна геоприв'язка цілей Мінцифри:** Виправлено проекцію Меркатора — цілі розставляються по відповідних областях України (Харків, Суми, Одеса тощо).
            - **🛩️ Вбудовані векторні іконки цілей (Base64):** Усі 10 офіційних іконок перенесені в Base64 без битих зображень.
            - **🧭 Траєкторії польоту та вектори:** Згладжений історичний трек, 1-хвилинний пунктирний вектор прогнозу та стрілка курсу.
            - **👆 Жести свайпу (Bottom Sheet):** Зручне відкриття свайпом вгору та згортання свайпом вниз.
            - **📱 Можливість встановити поряд з офіційним Флюгером:** Ідентифікатор `ua.rost.radar` для паралельного встановлення.
            - **🔊 Незалежні повзунки гучності:** Окреме регулювання гучності для тривоги та сонару.
            - **🗺️ Автономна темна карта без API key:** Тайловий сервіс ArcGIS Dark Gray Canvas + OSM + Satellite.

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть на смартфон.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
