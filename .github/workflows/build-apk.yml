name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.1
          name: Fluger Radar Android v1.4.1
          body: |
            ### 📡 Fluger Radar Android APK v1.4.1

            #### 🎯 Головні оновлення:
            - **💣 Каліброване виявлення КАБ (УМПК):** Впроваджено аеродинамічний профіль плануючих авіабомб згідно зі специфікацією сервера. Раннє детектування скиду вже з 2-го заміру (20–40 с польоту), часова стеля 160 с та аеродинамічний поріг швидкості зриву (≥340 км/год) для усунення хибних спрацьовувань на реактивних БПЛА.
            - **👥 Розпізнавання залпу КАБів:** Автоматична кластеризація парних скидів у коридорі польоту з маркуванням «[Група X/Y]» та окремим ешелоном пікірування.
            - **🔄 Безперервність треку для керованих Шахедів (гострі кути):** Усунуто жорстке кутове відсікання. При виконанні керованими БПЛА різких розворотів на 90°–180°, зигзагів ухилення або кружляння над районом трек більше не розривається на нові цілі.
            - **📍 Збереження траєкторії та курсу при зупинці/зависанні:** Виправлено занулення хвоста треку — тепер історія переміщення та вектор відображаються коректно навіть для завислих розвідників або при повільних маневрах.
            - **🛡️ Адаптивний моніторинг 45 км та 80 км:** Повна синхронізація з серверною мережею Флюгер.

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть поверх поточної версії.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
