name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.0
          name: Fluger Radar Android v1.3.0
          body: |
            ### 📡 Fluger Radar Android APK v1.3.0

            #### 🎯 Головні оновлення та виправлення:
            - **❓ Відображення цілей у невідомому стані:** Якщо ціль присутня на радарі Флюгер, але зараз не рухається (стаціонарний або перший замір), вона **більше не приховується**! Вона відображається на карті з чітким жовтим знаком питання (**?**), а зникає тільки тоді, коли зникає з самого Флюгера.
            - **🚨 Строгий кут курсу на вас ($\le 20^\circ$):** Критичний сигнал і сирена в червоній зоні тепер спрацьовують **строго тоді, коли ціль повернута курсом безпосередньо на вас (відхилення не більше 20 градусів)**. Ціль у червоній зоні, яка летить повз, дотично або віддаляється, більше не викликає помилкову сирену!
            - **🔊 Усунення подвійного звуку (тихо + повторно гучно):** Виправлено подвійне спрацьовування аудіо. Системний канал сповіщень переведено в тихий режим, а звук сирени та сонара відтворюється строго **один раз** через внутрішній аудіоплеєр із відсотком гучності, встановленим вами в налаштуваннях!
            - **🟡 Одноразове сповіщення для звичайного рівня:** Звичайні (жовті) сповіщення та звуковий сигнал надсилаються виключно при появі нової цілі в секторі (без набридливого спаму щохвилини для однієї й тієї самої цілі).
            - **🌐 Багатовузлове сканування сіткою (> 48 км):** Повний огляд на 90, 100, 140, 200 км через 7–13 паралельних вузлів Флюгера з просторовою кластеризацією без дублікатів.
            - **🔑 Постійний єдиний підпис:** Оновлюється автоматично поверх встановлених попередніх версій (v1.2.6+) без необхідності видалення застосунку!

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть поверх вашої поточної версії.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
