name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0
          name: Fluger Radar Android v1.2.0
          body: |
            ### 📡 Fluger Radar Android APK v1.2.0

            #### 🚀 Нові можливості та ключові виправлення:
            - **⏱️ Частота оновлення 20 секунд:** Інтервал опитування та таймер синхронізовано з офіційним сервером Флюгер (20 сек).
            - **🇺🇦 Виправлено проекцію карти Мінцифри (Повітряна тривога):** Координати розраховуються з точним масштабуванням проекції Меркатора — цілі розміщуються точно по областях України (Харків, Суми, Одеса тощо), а не групуються біля кордону з Польщею.
            - **🛩️ Вбудовані векторні іконки цілей (Base64):** Усі 10 офіційних іконок (Шахед, Реактивний БПЛА, КАБ, Крилата ракета, Балістика, Розвідник, Гелікоптер, Літак тощо) перенесені в Base64, биті зображення повністю ліквідовані.
            - **🧭 Траєкторії польоту та вектори напряму руху:** На карті відображається згладжений історичний трек із контрольними точками, 1-хвилинний пунктирний вектор прогнозованого руху та тактична стрілка курсу цілі.
            - **🧠 Повний перенос кінематики та правил розрахунку:** Точний перенос алгоритмів розрахунку швидкостей, ешелонів, курсу та конусів зближення з пітон-сервера.
            - **📱 Можливість встановити поряд з офіційним Флюгером:** Змінено ідентифікатор пакета на `ua.rost.radar` для паралельного встановлення без конфліктів підписів.
            - **🔊 Незалежне регулювання гучності:** Повзунки 0–100% окремо для критичної сирени та для тактичного сонара.
            - **🗺️ Автономна темна карта без API key:** Тайловий сервіс ArcGIS Dark Gray Canvas + OSM + Satellite.

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть на смартфон.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
