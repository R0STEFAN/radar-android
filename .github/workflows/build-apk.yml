name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.1.0
          name: Fluger Radar Android v1.1.0
          body: |
            ### 📡 Fluger Radar Android APK v1.1.0
            
            Оновлена версія з повноцінним тактичним інтерфейсом:
            
            #### 🚀 Нові можливості та виправлення:
            - **🗺️ Темна карта без API key:** Виправлено помилку "api key required" — підключено високошвидкісні сервери темних тайлів ArcGIS Canvas + OSM + супутник без жодних ключів.
            - **🔊 Регулювання гучності сповіщень:** Додано повзунки гучності (0–100%) окремо для критичного каналу та для каналу сектора.
            - **⏱️ Відлік часу до оновлення:** Живий таймер із прогрес-баром у верхньому HUD та кнопкою примусового оновлення.
            - **🏙️ Швидкий вибір міст:** Рядок швидкого переходу (Київ, Харків, Дніпро, Одеса, Запоріжжя, Львів тощо) з плавною анімацією польоту камери.
            - **🎯 Список розпізнаних цілей зі швидкістю:** Окрема вкладка з повним переліком активних загроз, швидкістю, пеленгом, відстанню, ETA та джерелом.
            - **🛸 Фільтр розвідників:** Можливість приховувати малошвидкісні розвідувальні БПЛА (<135 км/год).
            - **📡 Керування сенсорами:** Незалежні тумблери для джерел Флюгер та Мінцифри/ПС.
            
            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть поверх попередньої версії (оновлення застосунку).
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
