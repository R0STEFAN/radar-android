name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.3
          name: Fluger Radar Android v1.4.3
          body: |
            ### 📡 Fluger Radar Android APK v1.4.3

            #### 🎯 Головні оновлення:
            - **🛡️ Оновлення API Мінцифри (Повітряна тривога):**
              - Відновлено потік офіційних цілей Мінцифри з переходом на новий ендпоінт `map.ukrainealarm.com/api/centrifuge/map/fallback` замість застарілого/недоступного ендпоінту v2.
              - Реалізовано нативний модуль бінарного демаскування та десеріалізації фреймів Centrifugo (`CentrifugeMapDecoder.kt`): Xorshift32 PRNG демаскування, FNV-1a перевірка цілісності, LEB128 varint AST парсинг, Фішер-Єйтс дерандомізація конверта, деобфускація UUID треків та врахування зсувів маркерів (`markerOffsetX`, `markerOffsetY`).
              - Попередня ініціалізація вихідного вектора руху (`movement.from`) для миттєвої активації цілі на карті на першому ж циклі без затримок.
              - Оптимізована просторова фільтрація точок траєкторії польоту (>=120 м) для плавності відображення.
              - Підтримка виявлення режиму техобслуговування (`publicTargetsEnabled`) з автоматичним очищенням застарілих треків.
            - **💣 Покращене виявлення КАБ (УМПК) та залпових скидів:** Повна синхронізація з каліброваною аеродинамічною моделлю сервера.
            - **🔄 Захист від розриву треку для маневруючих Шахедів:** Підтримка гострих кутів та поворотів на 90°–180°.
            - **📍 Збереження повної траєкторії для завислих та низькошвидкісних цілей.**
            - **🔑 Постійний єдиний підпис:** Оновлюється автоматично поверх версій v1.2.6+ без видалення!

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть поверх поточної версії.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
