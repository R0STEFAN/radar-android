name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.2
          name: Fluger Radar Android v1.4.2
          body: |
            ### 📡 Fluger Radar Android APK v1.4.2

            #### 🎯 Головні оновлення:
            - **🛡️ Адаптація до оновлення API Мінцифри (Повітряна Тривога):** Підтримка нової структури масиву `targets` поруч із legacy `movement.from`, парсинг прямих та нормалізованих координат цілей.
            - **⏸️ Підтримка прапорця техобслуговування (`publicTargetsEnabled`):** Коректне виявлення режиму тимчасового призупинення публічного потоку цілей Мінцифрою з автоматичним очищенням застарілих треків, щоб уникнути зависання «фантомних» цілей під час регламентних робіт.
            - **💣 Покращене виявлення КАБ (УМПК) та залпових скидів:** Повна синхронізація з каліброваною аеродинамічною моделлю сервера.
            - **🔄 Захист від розриву треку для маневруючих Шахедів:** Підтримка гострих кутів та поворотів на 90°–180°.
            - **📍 Збереження повної траєкторії для завислих та низькошвидкісних цілей.**

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть поверх поточної версії.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
