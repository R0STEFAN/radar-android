name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.4
          name: Fluger Radar Android v1.4.4
          body: |
            ### 📡 Fluger Radar Android APK v1.4.4

            #### 🎯 Головні оновлення:
            - **📡 Відновлення API Радара «Флюгер» (`radar.quick.ua`):**
              - Оновлено структуру пакету автентифікації (`fcmToken` у форматі Firebase Cloud Messaging та `googleToken: null`), що усуває блокування старого токена на боці сервера.
            - **🛡️ Оновлення протоколу Мінцифри (`~5:` ChaCha20 + JSON-конверт):**
              - Додано розпакування JSON-конвертів `{"n": "~5:..."}` ендпоінту `map.ukrainealarm.com/api/centrifuge/map/fallback`.
              - Реалізовано повну підтримку нового бінарного протоколу `~5:` у `CentrifugeMapDecoder.kt` (потокове демаскування ChaCha20 20 раундів, перевірка FNV-1a, 3 незалежних ГПВЧ Xorshift32 для перестановки тегів типів, маскування рядків/чисел та циклічних зсувів масивів, 6 площин даних та вектори `prediction`).
              - Миттєве відображення верифікованих цілей Мінцифри з відомим офіційним курсом (`heading`) та призначення типових крейсерських швидкостей за класом цілі.
              - Підтримка нових типів та іконок: `ic_banderol` («Бандероль»), `ic_shahed_jet_mesh` та розвідувальних БПЛА (`ZALA`, `Supercam`, `Ланцет`).
            - **🚦 Чітка індикація рівнів небезпеки у верхньому HUD-банері:**
              - **🟢 Зелений («СЕКТОР ЧИСТИЙ»)** — у радіусі огляду немає цілей.
              - **🟡 Жовтий («СПОСТЕРЕЖЕННЯ: ЦІЛІ В СЕКТОРІ»)** — ціль у межах жовтого кола огляду (навіть якщо звуковий тумблер сектору вимкнено).
              - **🔴 Червоний («ЗАГРОЗА В РАДІУСІ СПОВІЩЕННЯ»)** — ціль увійшла в червоне коло тривоги.
              - **🚨 Критичний («НЕБЕЗПЕКА: КУРС НА ВАС!»)** — ціль у червоному колі летить безпосередньо курсом на вас.
            - **🔑 Постійний єдиний підпис:** Оновлюється автоматично поверх попередніх версій без видалення!

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть поверх поточної версії.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
