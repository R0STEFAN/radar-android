name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.8
          name: Fluger Radar Android v1.2.8
          body: |
            ### 📡 Fluger Radar Android APK v1.2.8

            #### 🚀 Багатовузлове регіональне сканування сіткою (Multi-Node Regional Grid Scan > 48 км) та інтелектуальна кластеризація цілей:
            - **🌐 Регіональна сітка сенсорів (Multi-Node Grid):** Якщо радіус огляду встановлено > 48 км (90, 100, 140, 200 км), радар Флюгера тепер сканує простір на повну глибину сектору через 5–13 розподілених географічних вузлів одночасно (через паралельні корутини).
            - **🛡️ Інтелектуальна кластеризація та усунення дублікатів («без сміття»):** Створено алгоритм злиття азимутальних променів та тріангуляційних перетинів з урахуванням кутових похибок ($\le 8^\circ$) та просторової близькості ($\le 8.5$ км). Запобігає появі фантомних клонів однієї й тієї ж цілі.
            - **⚡ Швидкий локальний режим для $\le 48$ км:** При радіусі огляду до 48 км зберігається миттєвий 2-точковий режим тріангуляції для максимального збереження батареї та трафіку.
            - **🧭 Точні вектори польоту та стрілки напрямку:** Стабільне відображення курсу для всіх виявлених цілей.
            - **🔑 Постійний єдиний підпис (Release Keystore):** Додаток оновлюється автоматично поверх встановленої версії без видалення!
            - **🗺️ Leaflet Dark Gray Canvas + Лінія фронту DeepStateMap:** Повна автономна тактична обстановка.
            - **⏱️ Синхронізований 20-секундний ритм:** Стабільний відлік і паралельне оновлення обох датчиків.

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть на смартфон поверх попередньої версії!
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
