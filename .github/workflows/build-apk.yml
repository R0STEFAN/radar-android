name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.4
          name: Fluger Radar Android v1.2.4
          body: |
            ### 📡 Fluger Radar Android APK v1.2.4

            #### 🚀 Нові можливості та ключові виправлення:
            - **⏱️ Усунено збій таймера та прогрес-бару на 14 секунді:** Виправлено розсинхронізацію між UI та фоновою службою. Таймер більше не перезапускається завчасно посеред циклу — він рахує чітко від 20 до 0 с, а скидається на 20 с виключно в момент реального надходження свіжих радіолокаційних даних.
            - **🔄 Єдиний точний 20-секундний ритм опитування (Fluger + Мінцифра):** API Флюгера оновлює дані строго кожні 20 секунд (`refresh: 20`). Фонова служба тепер циклічно опитує обидва джерела (Флюгер та Мінцифру) одночасно з точним періодом 20 секунд, компенсуючи час мережевого запиту.
            - **⚔️ Інтеграція лінії фронту та окупованих територій DeepStateMap:** Додано шар DeepStateMap (окуповані території, Крим/ОРДЛО, звільнені райони) з автоматичним 2-годинним кешуванням та перемикачем у меню шарів карти та налаштуваннях.
            - **🟡/🔴 Чітке розмежування кольорів загроз (Сектор vs Сповіщення):** Усі цілі в радіусі огляду відображаються жовтим кольором, а червоним із тривогою `🚨 НА ВАС!` — виключно ті, які знаходяться всередині радіуса сповіщень і рухаються в бік вашої точки.
            - **🛡️ Придушення нерухомих точок (75с буферизація):** Цілі без фізичного руху (швидкість < 45 км/год, менше 2 точок або зміщення < 0.25 км) не відображаються на карті, але зберігаються в пам'яті до 75 секунд і з'являються лише після підтвердження реального польоту.
            - **🎯 Локалізація цілей Мінцифри за сектором спостереження:** Цілі «Повітряна тривога» обмежені радіусом сектора (з опцією перегляду всієї України).
            - **🧭 Точна векторна стрілка та траєкторія польоту:** Вектор збігається з фізичним напрямком руху.
            - **💣 Відстеження КАБ та кластеризація груп цілей:** Повна логіка визначення УМПК та групових запусків.
            - **📱 Встановлення поряд з офіційним додатком:** Пакет `ua.rost.radar`.
            - **🗺️ Автономна темна карта без API key:** Тайловий сервіс ArcGIS Dark Gray Canvas + OSM + Satellite.

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть на смартфон.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
