name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluger-radar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.5
          name: Fluger Radar Android v1.4.5
          body: |
            ### 📡 Fluger Radar Android APK v1.4.5

            #### 🎯 Головні оновлення:
            - **📲 Вбудоване оновлення прямо з застосунку (GitHub Auto-Updater):**
              - У нижній частині вкладки «Налаштування» додано картку **«Версія та оновлення»** з відображенням поточної версії застосунку.
              - Кнопка **«🔍 Перевірити оновлення»** звертається до GitHub Releases API (`R0STEFAN/radar-android`) і порівнює вашу версію з найсвіжішим релізом.
              - Кнопка **«⬇️ Оновити зараз»** завантажує APK з індикатором прогресу (%) та автоматично відкриває системне вікно встановлення Android (із автоматичним запитом дозволу на встановлення з невідомих джерел, якщо його ще не надано).
            - **📡 Відновлення API Радара «Флюгер» (`radar.quick.ua`):**
              - Оновлено структуру пакету автентифікації (`fcmToken` у форматі Firebase Cloud Messaging та `googleToken: null`).
            - **🛡️ Оновлення протоколу Мінцифри (`~5:` ChaCha20 + JSON-конверт):**
              - Повна підтримка нового бінарного протоколу `~5:` у `CentrifugeMapDecoder.kt` (потокове демаскування ChaCha20, FNV-1a, 3 незалежних ГПВЧ Xorshift32, 6 площин даних та вектори `prediction`).
              - Миттєве відображення верифікованих цілей Мінцифри з відомим офіційним курсом (`heading`) та підтримка нових типів (`ic_banderol`, `ic_shahed_jet_mesh`, `ZALA`, `Supercam`, `Ланцет`).
            - **🚦 4-рівнева індикація небезпеки у верхньому HUD-банері:**
              - **🟢 Зелений («СЕКТОР ЧИСТИЙ»)** — у радіусі огляду немає цілей.
              - **🟡 Жовтий («СПОСТЕРЕЖЕННЯ: ЦІЛІ В СЕКТОРІ»)** — ціль у межах жовтого кола огляду.
              - **🔴 Червоний («ЗАГРОЗА В РАДІУСІ СПОВІЩЕННЯ»)** — ціль у червоному колі тривоги.
              - **🚨 Критичний («НЕБЕЗПЕКА: КУРС НА ВАС!»)** — ціль у червоному колі летить безпосередньо курсом на вас.
            - **🔑 Постійний єдиний підпис:** Оновлюється автоматично поверх попередніх версій без видалення!

            #### 📲 Встановлення:
            Завантажте файл `app-release.apk` нижче та встановіть поверх поточної версії (надалі всі наступні оновлення можна буде встановлювати однією кнопкою прямо з налаштувань застосунку!).
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
